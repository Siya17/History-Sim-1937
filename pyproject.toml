[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulation-game-runner"
version = "0.1.0"
description = "Runner for the 1937 Simulation Game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gspread>=6.2.1",
    "oauth2client>=4.1.3",
    "sim1937",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.uv.sources]
sim1937 = { path = "libs/sim1937", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = ["libs"]
